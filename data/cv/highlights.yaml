- title: "Service-Oriented Leader"
  body: "Four-time inaugural director of initiatives that last. Builds teams and coalitions across sectors and disciplines that are mission-oriented, energized, and effective. Empathetic servant leader focused on maintaining the boring technical infrastructure that keeps the world running smoothly."

- title: "Interdisciplinary Historian of Science"
  body: "Author of two books and dozens of articles spanning the humanities, social sciences, and natural sciences which leverage computation to illuminate the human experience. Collectively, these publications have accrued 4,000 citations, appeared on over 1,000 academic syllabi, and been translated into eight languages."

- title: "Recognized Expert in Field"
  body: "Recipient of the Fortier Prize by the Alliance of Digital Humanities Organizations, and the Best Formative Initiative prize by La Asociación de Humanidades Digitales Hispánicas. Keynote speaker at international conferences. Principal investigator of or contributor to the securing of $17 million in grants by organizations including the National Institutes of Health, the National Science Foundation, the National Endowment for the Humanities, the Getty Foundation, and the Mellon Foundation."

- title: "Community Contributor"
  body: "Elected executive board member of scholarly societies and invited board member on several global cultural and research initiatives. Conference convener. Volunteer strategic planner and head of IT for local religious organizations. Maintainer of frequently-used digital archival resources."

- title: "Performer"
  body: "Professional performer and instructor of juggling and associated circus arts."
