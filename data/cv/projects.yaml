# Selected Projects, Tools, Websites, &c. (CV pages 16–18)
- intro: true
  text: "Many scholarly projects are never intended for publication. A selection to which I have contributed appears below. (“Project Manager” is abbreviated PM.)"
- text: "**Accounting for Bias in Historical Data**. Discover archival absence and statistically account for voices that are missing."
  note: "PI"
- text: "**Bias in DH**. Analyze gender, geographic, and topical bias in the digital humanities community."
  note: "PI"
- text: "**Bibliometrics at CMU**. Explore collaboration at CMU."
  note: "PI"
- text: "**Digital Humanities Literacy Guidebook**. Teaching DH to newcomers. [10.1184/r1/10250381](https://doi.org/10.1184/r1/10250381)"
  note: "PI"
- text: "**Digits**. Assess possible technical interventions to reduce the friction associated with publishing digital scholarship."
  note: "PI"
- text: "**Finding the History & Philosophy of Science**. Bibliometrically analyze the history and philosophy of science communities."
  note: "PI"
- text: "**Punched Card Humanities**. Research the early usage of computation in the humanities."
  note: "PI"
- text: "**Republic of Letters**. Reconstruct and analyze the correspondence networks underlying early modern science."
  note: "PI"
- text: "**The Index of Digital Humanities Conferences**. Create a website / digital archive making accessible the history of the digital humanities community. [10.34666/k1de-j489](https://doi.org/10.34666/k1de-j489)"
  note: "PI"
- text: "**The Last Tree**. Create a website on the history of diagrams of knowledge. [http://last-tree.scottbot.net/](http://last-tree.scottbot.net/)"
  note: "PI"
- text: "**Bridges of Pittsburgh**. Find and beautifully present an efficient route through all the bridges in Pittsburgh. [10.1184/r1/8276171](https://doi.org/10.1184/r1/8276171)"
  note: "Co-PI"
- text: "**CAMPI**. Create a machine-learning augmented interface to aid archivists in the processing of large photography collections. [10.1184/R1/12791807](https://doi.org/10.1184/R1/12791807)"
  note: "Co-PI"
- text: "**Gender and the Body in European Fairy Tales**. Discover how early European fairy tales described bodies."
  note: "Co-PI"
- text: "**Introduction to Network Analysis and Representation**. Create a website to help people understand fundamental aspects of network analysis. [https://emeeks.github.io/networks/](https://emeeks.github.io/networks/)"
  note: "Co-PI"
- text: "**Six Degrees of Francis Bacon**. Mine, crowdsource, and present a social network of Early Modern Britain. [10.1184/dh/af729e](https://doi.org/10.1184/dh/af729e)"
  note: "Co-PI"
- text: "**The Center for Midnight**. Write a piece of fiction with students, AI algorithms, and best-selling novelist Robin Sloan. [https://www.robinsloan.com/center-for-midnight/](https://www.robinsloan.com/center-for-midnight/)"
  note: "Co-PI"
- text: "**Unlocking Digital Texts**. Lay the groundwork for an Interoperable Text Framework, doing for text what IIIF does for images."
  note: "Co-PI"
- text: "**ePistolarium**. Create a resource for historians to explore early modern letters. [http://ckcc.huygens.knaw.nl/epistolarium/](http://ckcc.huygens.knaw.nl/epistolarium/)"
  note: "PM"
- text: "**Ethics & Artificial Intelligence**. Understand how ethics is discussed in the context of artificial intelligence using text analytic techniques."
  note: "PM"
- text: "**ETHOS: Encyclopedia of the History of Science**. Develop an online, open-access encyclopedia. [https://lps.library.cmu.edu/ETHOS/](https://lps.library.cmu.edu/ETHOS/)"
  note: "PM"
- text: "**Frankenstein Variorum**. Create a new edition of Frankenstein, highlighting variations between early editions. [https://frankensteinvariorum.org/](https://frankensteinvariorum.org/)"
  note: "PM"
- text: "**Biography of a Course: Golf Analytics**. Quantitatively analyze a half century of golf tournaments to learn the biography of a course. [https://shiny.library.cmu.edu/golf/](https://shiny.library.cmu.edu/golf/)"
  note: "PM"
- text: "**Janeway at CMU**. Facilitate the launch of a CMU libraries journal platform."
  note: "PM"
- text: "**Mapping Gandhi**. Create an interactive map charting Gandhi’s social interventions in a region of India."
  note: "PM"
- text: "**Mining the Television Megatext**. Analyze 1950s television through text and databases."
  note: "PM"
- text: "**Sci2 Tool**. Create scientific software to analyze networks."
  note: "PM"
